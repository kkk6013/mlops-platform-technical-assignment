<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MLOps Model Registry</title>

<style>

*{box-sizing:border-box;margin:0;padding:0}

body{font-family:Arial,sans-serif;background:#f5f7fa;color:#333;padding:20px}

h1{text-align:center;color:#1a237e;margin-bottom:24px}

h2{color:#283593;margin-bottom:12px;border-bottom:2px solid #c5cae9;padding-bottom:6px}

.container{max-width:900px;margin:0 auto}

.card{background:#fff;border-radius:8px;padding:20px;margin-bottom:20px;box-shadow:0 2px 6px rgba(0,0,0,0.1)}

.form-row{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}

input,select{padding:8px 12px;border:1px solid #ccc;border-radius:4px;font-size:14px}

button{padding:8px 18px;border:none;border-radius:4px;cursor:pointer;font-size:14px;color:#fff}

.btn-primary{background:#3f51b5}

.btn-success{background:#388e3c}

.btn-warning{background:#f57c00}

table{width:100%;border-collapse:collapse;margin-top:12px}

th{background:#e8eaf6;color:#1a237e;text-align:left;padding:10px}

td{padding:10px;border-bottom:1px solid #eee}

tr:hover{background:#f5f5f5}

.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:bold;color:#fff}

.badge-draft{background:#9e9e9e}

.badge-validated{background:#42a5f5}

.badge-approved{background:#66bb6a}

.badge-staging{background:#ffa726}

.badge-production{background:#ef5350}

.badge-archived{background:#78909c}

.msg{padding:10px;border-radius:4px;margin-top:10px;display:none}

.msg-success{background:#e8f5e9;color:#2e7d32;border:1px solid #a5d6a7}

.msg-error{background:#ffebee;color:#c62828;border:1px solid #ef9a9a}

.loading{text-align:center;color:#999;padding:20px}

</style>

</head>

<body>

<div class="container">

<h1>MLOps Model Registry</h1>

<div class="card">

<h2>System Health</h2>

<p id="health-status">Checking...</p>

</div>

<div class="card">

<h2>Register New Model</h2>

<div class="form-row">

<input type="text" id="model-name" placeholder="Model name">

<input type="text" id="model-desc" placeholder="Description (optional)">

<button class="btn-primary" onclick="createModel()">Register Model</button>

</div>

<div id="create-msg" class="msg"></div>

</div>

<div class="card">

<h2>Model Inventory</h2>

<button class="btn-primary" onclick="loadModels()" style="margin-bottom:10px">Refresh</button>

<div id="models-list"><p class="loading">Click Refresh to load models...</p></div>

</div>

<div class="card">

<h2>Version Management</h2>

<div class="form-row">

<select id="version-model-id"><option value="">-- Select a model --</option></select>

<button class="btn-primary" onclick="loadVersions()">Load Versions</button>

</div>

<div style="margin-top:12px">

<h3 style="margin-bottom:8px;color:#555">Add New Version</h3>

<div class="form-row">

<input type="text" id="v-framework" placeholder="Framework (e.g. sklearn)">

<input type="text" id="v-algorithm" placeholder="Algorithm (e.g. xgboost)">

<input type="text" id="v-artifact" placeholder="Artifact URI">

<button class="btn-primary" onclick="addVersion()">Add Version</button>

</div>

</div>

<div id="version-msg" class="msg"></div>

<div id="versions-list"></div>

</div>

</div>


<script>

var API="http://127.0.0.1:8000";

function checkHealth(){fetch(API+"/health").then(function(r){return r.json()}).then(function(d){document.getElementById("health-status").innerHTML='<span style="color:green;font-weight:bold">Online</span> - '+d.time}).catch(function(){document.getElementById("health-status").innerHTML='<span style="color:red;font-weight:bold">Offline</span> - Make sure backend is running.'})}

function showMsg(id,text,err){var el=document.getElementById(id);el.textContent=text;el.className="msg "+(err?"msg-error":"msg-success");el.style.display="block";setTimeout(function(){el.style.display="none"},4000)}

function createModel(){var name=document.getElementById("model-name").value.trim();if(!name){showMsg("create-msg","Please enter a model name.",true);return}var desc=document.getElementById("model-desc").value.trim()||null;fetch(API+"/models",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:name,description:desc})}).then(function(r){if(r.ok){return r.json().then(function(d){showMsg("create-msg","Model registered: "+d.name,false);document.getElementById("model-name").value="";document.getElementById("model-desc").value="";loadModels()})}else{return r.json().then(function(e){showMsg("create-msg","Error: "+e.detail,true)})}}).catch(function(){showMsg("create-msg","Failed to connect.",true)})}

function loadModels(){var c=document.getElementById("models-list");c.innerHTML='<p class="loading">Loading...</p>';fetch(API+"/models").then(function(r){return r.json()}).then(function(models){if(models.length===0){c.innerHTML="<p>No models yet.</p>";return}var dd=document.getElementById("version-model-id");dd.innerHTML='<option value="">-- Select a model --</option>';var h="<table><tr><th>Name</th><th>ID</th><th>Versions</th><th>Created</th></tr>";models.forEach(function(m){h+="<tr><td><strong>"+m.name+"</strong></td><td>"+m.model_id.slice(0,8)+"...</td><td>"+m.versions.length+"</td><td>"+new Date(m.created_at).toLocaleString()+"</td></tr>";dd.innerHTML+='<option value="'+m.model_id+'">'+m.name+"</option>"});h+="</table>";c.innerHTML=h}).catch(function(){c.innerHTML='<p style="color:red">Failed to load models.</p>'})}

function loadVersions(){var mid=document.getElementById("version-model-id").value;var c=document.getElementById("versions-list");if(!mid){showMsg("version-msg","Select a model first.",true);return}c.innerHTML='<p class="loading">Loading...</p>';fetch(API+"/models/"+mid+"/versions").then(function(r){return r.json()}).then(function(versions){if(versions.length===0){c.innerHTML="<p>No versions yet.</p>";return}var h="<table><tr><th>#</th><th>Framework</th><th>Algorithm</th><th>Stage</th><th>Approved</th><th>Actions</th></tr>";versions.forEach(function(v){h+="<tr><td>"+v.version_number+"</td><td>"+v.framework+"</td><td>"+v.algorithm+"</td>";h+='<td><span class="badge badge-'+v.stage.toLowerCase()+'">'+v.stage+"</span></td>";h+="<td>"+(v.approved?"Yes":"No")+"</td><td>";if(!v.approved){h+='<button class="btn-success" onclick="approveVersion(\''+mid+"','"+v.version_id+"')\">Approve</button> "}h+='<select id="stage-'+v.version_id+'"><option value="DRAFT">DRAFT</option><option value="VALIDATED">VALIDATED</option><option value="STAGING">STAGING</option><option value="PRODUCTION">PRODUCTION</option><option value="ARCHIVED">ARCHIVED</option></select> ';h+='<button class="btn-warning" onclick="promoteVersion(\''+mid+"','"+v.version_id+"')\">Promote</button></td></tr>"});h+="</table>";c.innerHTML=h}).catch(function(){c.innerHTML='<p style="color:red">Failed to load versions.</p>'})}

function addVersion(){var mid=document.getElementById("version-model-id").value;if(!mid){showMsg("version-msg","Select a model first.",true);return}var fw=document.getElementById("v-framework").value.trim();var al=document.getElementById("v-algorithm").value.trim();var ar=document.getElementById("v-artifact").value.trim();if(!fw||!al||!ar){showMsg("version-msg","Fill in all fields.",true);return}fetch(API+"/models/"+mid+"/versions",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({framework:fw,algorithm:al,artifact_uri:ar})}).then(function(r){if(r.ok){return r.json().then(function(d){showMsg("version-msg","Version "+d.version_number+" added.",false);document.getElementById("v-framework").value="";document.getElementById("v-algorithm").value="";document.getElementById("v-artifact").value="";loadVersions()})}else{return r.json().then(function(e){showMsg("version-msg","Error: "+e.detail,true)})}}).catch(function(){showMsg("version-msg","Failed to connect.",true)})}

function approveVersion(mid,vid){fetch(API+"/models/"+mid+"/versions/"+vid+"/approve",{method:"POST"}).then(function(r){if(r.ok){showMsg("version-msg","Approved!",false);loadVersions()}else{r.json().then(function(e){showMsg("version-msg","Error: "+e.detail,true)})}}).catch(function(){showMsg("version-msg","Failed to connect.",true)})}

function promoteVersion(mid,vid){var stage=document.getElementById("stage-"+vid).value;fetch(API+"/models/"+mid+"/versions/"+vid+"/promote",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({stage:stage})}).then(function(r){if(r.ok){showMsg("version-msg","Promoted to "+stage,false);loadVersions()}else{r.json().then(function(e){showMsg("version-msg","Error: "+e.detail,true)})}}).catch(function(){showMsg("version-msg","Failed to connect.",true)})}

checkHealth();

</script>

</body>

</html>
